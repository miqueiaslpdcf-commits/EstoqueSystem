<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GESTÃO</title>

<style>
body {
    font-family: Arial;

    /* MESMO FUNDO DO HOME */
    background: url("../assets/home.jpg") center/cover no-repeat fixed;

    margin: 0;
    padding: 20px;

    color: #fff;
    position: relative;
    z-index: 1; /* GARANTE QUE FICA ACIMA */
}

/* SOBREPOSIÇÃO ESCURA (igual do home) */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: -1;
}

/* MENU SUPERIOR */
.topo {
    display: flex;
    gap: 10px;
    padding: 15px;
    backdrop-filter: blur(6px);
    position: sticky;
    top: 0;
    z-index: 10;
}

.btn-menu {
    background: rgba(255,255,255,0.1);
    border: none;
    padding: 10px 20px;
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    transition: 0.3s;
    display: inline-block;
}

.btn-menu:hover {
    background: rgba(255,255,255,0.3);
}

/* TELA INICIAL */
#inicio {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    margin-top: 60px;
    padding: 20px;
}

/* GRID DOS CARDS */
.cards {
    display: flex;
    gap: 25px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 40px;
}

/* SOMENTE COMPUTADOR */
@media (min-width: 769px) {
    .cards {
        width: 1000px;
        margin-left: auto;
        margin-right: auto;
    }
}

/* CARD BASE */
.card {
    width: 180px;
    height: 140px;
    border-radius: 16px;
    color: #fff;
    font-size: 20px;
    font-weight: bold;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

/* TEXTO */
.card span {
    margin-top: 10px;
    font-size: 16px;
}

/* HOVER */
.card:hover {
    transform: translateY(-8px) scale(1.05);
    box-shadow: 0 18px 40px rgba(0,0,0,0.5);
}

/* CORES DOS CARDS */
.escala {
    position: relative;
    width: 210px;
    height: 170px;
    overflow: hidden;
    background: linear-gradient(145deg, #c9a27a 0%, #a97c52 55%, #8a6038 100%);
    border: 1px solid rgba(255, 233, 196, 0.45);
    box-shadow:
        0 12px 28px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255, 240, 215, 0.45);
}

/* brilho suave no topo do card */
.escala::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 55%;
    background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0));
    pointer-events: none;
}

.escala:hover {
    box-shadow:
        0 20px 42px rgba(0,0,0,0.55),
        0 0 22px rgba(201, 162, 122, 0.45),
        inset 0 1px 0 rgba(255, 240, 215, 0.55);
}

/* ícone dentro de um círculo */
.card .icone {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 62px;
    height: 62px;
    font-size: 32px;
    border-radius: 50%;
    background: rgba(60, 35, 15, 0.25);
    border: 1px solid rgba(255, 233, 196, 0.5);
}

.escala span {
    margin-top: 12px;
    font-size: 17px;
    letter-spacing: 1px;
    color: #fff8ec;
    text-shadow: 0 1px 3px rgba(60, 35, 15, 0.5);
}

.card small {
    margin-top: 4px;
    font-size: 12px;
    font-weight: normal;
    color: rgba(255, 248, 236, 0.85);
}
</style>
</head>

<body>

<!-- MENU SUPERIOR -->
<nav class="topo">
    <a href="../index.html" class="btn-menu">🏠 Início</a>
</nav>


<!-- TELA INICIAL -->
<div id="inicio">

    <h1>📊 BEM-VINDO À GESTÃO</h1>
    <p>ESCOLHA UMA DAS OPÇÕES:</p>

    <div class="cards">

        <div class="card escala" onclick="window.location.href='escala.html'">
            <div class="icone">🗓️</div>
            <span>Escala</span>
            <small>Gerenciar Escala da Equipe</small>
        </div>

        <!-- adicione novos cards aqui -->

    </div>

</div>

</body>
</html>
