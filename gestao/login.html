<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOGIN - GESTÃO</title>

<style>
body {
    font-family: Arial;

    /* MESMO FUNDO DO HOME */
    background: url("../assets/home.jpg") center/cover no-repeat fixed;

    margin: 0;
    padding: 20px;

    color: #fff;
    position: relative;
    z-index: 1;
}

/* SOBREPOSIÇÃO ESCURA */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: -1;
}

/* MENU SUPERIOR */
.topo {
    display: flex;
    gap: 10px;
    padding: 15px;
    backdrop-filter: blur(6px);
    position: sticky;
    top: 0;
    z-index: 10;
}

.btn-menu {
    background: rgba(255,255,255,0.1);
    border: none;
    padding: 10px 20px;
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    transition: 0.3s;
    display: inline-block;
}

.btn-menu:hover {
    background: rgba(255,255,255,0.3);
}

/* CAIXA DE LOGIN */
.login-box {
    width: 100%;
    max-width: 360px;
    margin: 60px auto 0;
    padding: 36px 30px;
    border-radius: 16px;
    text-align: center;
    background: linear-gradient(145deg, #c9a27a 0%, #a97c52 55%, #8a6038 100%);
    border: 1px solid rgba(255, 233, 196, 0.45);
    box-shadow:
        0 18px 40px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255, 240, 215, 0.45);
}

.login-box .icone {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 70px;
    height: 70px;
    margin: 0 auto 14px;
    font-size: 34px;
    border-radius: 50%;
    background: rgba(60, 35, 15, 0.25);
    border: 1px solid rgba(255, 233, 196, 0.5);
}

.login-box h1 {
    margin: 0 0 4px;
    font-size: 22px;
    letter-spacing: 1px;
    color: #fff8ec;
    text-shadow: 0 1px 3px rgba(60, 35, 15, 0.5);
}

.login-box p {
    margin: 0 0 24px;
    font-size: 13px;
    color: rgba(255, 248, 236, 0.85);
}

.campo {
    text-align: left;
    margin-bottom: 16px;
}

.campo label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    color: #fff8ec;
}

.campo input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid rgba(255, 233, 196, 0.5);
    border-radius: 8px;
    background: rgba(255, 248, 236, 0.92);
    color: #3b2412;
    font-size: 15px;
    outline: none;
    box-sizing: border-box;
    transition: 0.2s;
}

.campo input:focus {
    border-color: #fff;
    box-shadow: 0 0 0 3px rgba(255, 233, 196, 0.35);
}

.btn-entrar {
    width: 100%;
    margin-top: 6px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #4a2c14;
    color: #fff8ec;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
    transition: 0.3s;
}

.btn-entrar:hover {
    background: #5e3a1d;
    transform: translateY(-2px);
}

.erro {
    min-height: 20px;
    margin-top: 14px;
    font-size: 13px;
    font-weight: bold;
    color: #fff;
    text-shadow: 0 1px 3px rgba(80, 10, 10, 0.8);
}
</style>
</head>

<body>

<!-- MENU SUPERIOR -->
<nav class="topo">
    <a href="../index.html" class="btn-menu">🏠 Início</a>
</nav>

<!-- CAIXA DE LOGIN -->
<div class="login-box">
    <div class="icone">🔒</div>
    <h1>ÁREA DE GESTÃO</h1>
    <p>Informe suas credenciais para continuar</p>

    <form id="formLogin" autocomplete="off">
        <div class="campo">
            <label for="usuario">Usuário</label>
            <input type="text" id="usuario" required autofocus>
        </div>

        <div class="campo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" required>
        </div>

        <button type="submit" class="btn-entrar">ENTRAR</button>
        <div class="erro" id="erro"></div>
    </form>
</div>


<script>
// CADASTRO DE USUÁRIOS DA GESTÃO
const USUARIOS_GESTAO = [
    { usuario: "valdenio", senha: "0454" },
    { usuario: "miqueias", senha: "0930" },
    { usuario: "rayane", senha: "0454" },
    { usuario: "rh", senha: "0454" }
];

document.getElementById("formLogin").addEventListener("submit", function(e) {
    e.preventDefault();

    const usuario = document.getElementById("usuario").value.trim();
    const senha = document.getElementById("senha").value;
    const erro = document.getElementById("erro");

    const usuarioEncontrado = USUARIOS_GESTAO.find(
        u => u.usuario === usuario && u.senha === senha
    );

    if (usuarioEncontrado) {
        sessionStorage.setItem("gestaoAuth", "1");
        sessionStorage.setItem("gestaoUsuario", usuarioEncontrado.usuario);

        window.location.href = "gestao.html";
    } else {
        erro.textContent = "Usuário ou senha incorretos.";
        document.getElementById("senha").value = "";
        document.getElementById("senha").focus();
    }
});
</script>


</body>
</html>
