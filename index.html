<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVRARIA DA PRAÇA - MSYSTEM</title>
    <!-- CSS principal do Home -->
    <link rel="stylesheet" href="../EstoqueSystem/home.css">

    <!-- Estilo do botão Gestão -->
    <style>
        .botoes.botao-gestao {
            margin-top: 35px; /* espaço entre os botões de cima e o Gestão */
        }

        .btn.gestao {
            background-color: #2f5d62; /* azul-petróleo */
            color: #ffffff;
        }

        .btn.gestao:hover {
            background-color: #24484c;
        }
    </style>
</head>
<body>

<h1>OLÁ, SEJA BEM-VINDO!👋</h1>
<p>ESCOLHA QUAL EMPRESA VOCÊ DESEJA ACESSAR</p>

<div class="botoes">
    <!-- Botão Cafeteria -->
    <button class="btn cafeteria" onclick="entrarSistema('cafeteria')">☕ Café</button>
    <!-- Botão Livraria -->
    <button class="btn livraria" onclick="entrarSistema('livraria')">📚 Livraria</button>
</div>

<!-- Botão Gestão (abaixo de Café e Livraria) -->
<div class="botoes botao-gestao">
    <button class="btn gestao" onclick="entrarSistema('gestao')">📊 Gestão</button>
</div>

<script src="script.js"></script>
<script>
function entrarSistema(tipo){
    if(tipo === "cafeteria"){
        window.location.href = "cafe/cafe.html";
    }
    if(tipo === "livraria"){
        window.location.href = "livraria/livraria.html";
    }
    if(tipo === "gestao"){
        window.location.href = "gestao/gestao.html";
    }
}
</script>
</body>
</html>
