<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<title>Contagem do Café</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    min-height:100vh;

    font-family:"Inter","Segoe UI",Arial,sans-serif;

    color:#3b2a1f;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:25px;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(199,154,69,.15),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #f6f0e9,
            #eadfd2
        );
}


/* ==============================
   CONTAINER
============================== */

.container{
    width:100%;
    max-width:900px;

    text-align:center;
}


/* ==============================
   CABEÇALHO
============================== */

.cabecalho{
    margin-bottom:42px;
}

.iconePrincipal{
    width:82px;
    height:82px;

    margin:0 auto 18px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #7b1e2b,
            #5d1621
        );

    font-size:42px;

    box-shadow:
        0 10px 25px rgba(93,22,33,.20);

    border:4px solid rgba(199,154,69,.55);
}

h1{
    margin:0;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:clamp(32px,6vw,46px);

    font-weight:700;

    letter-spacing:4px;

    color:#5d1621;
}

.sub{
    margin-top:12px;

    color:#6f5848;

    font-size:15px;

    letter-spacing:.4px;
}


/* ==============================
   LINHA DECORATIVA
============================== */

.decoracao{
    display:flex;
    align-items:center;
    justify-content:center;

    gap:12px;

    margin-top:20px;
}

.decoracao span{
    width:80px;
    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #c79a45
        );
}

.decoracao span:last-child{
    background:
        linear-gradient(
            90deg,
            #c79a45,
            transparent
        );
}

.decoracao i{
    width:7px;
    height:7px;

    background:#c79a45;

    transform:rotate(45deg);

    display:block;
}


/* ==============================
   BOTÕES
============================== */

.botoes{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:20px;
}


/* ==============================
   CARTÃO
============================== */

.botao{
    position:relative;

    text-decoration:none;

    color:#3b2a1f;

    background:#fffaf4;

    border:1px solid #dccbb7;

    border-radius:20px;

    padding:30px 24px;

    min-height:260px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    box-shadow:
        0 8px 25px rgba(75,51,40,.10);

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        border-color .25s ease;
}


/* detalhe dourado no topo */

.botao::before{
    content:"";

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:4px;

    background:
        linear-gradient(
            90deg,
            #7b1e2b,
            #c79a45,
            #7b1e2b
        );
}


/* brilho suave */

.botao::after{
    content:"";

    position:absolute;

    width:180px;
    height:180px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(199,154,69,.10),
            transparent 70%
        );

    top:-80px;
    right:-80px;

    pointer-events:none;
}


/* hover */

.botao:hover{
    transform:translateY(-7px);

    border-color:#c79a45;

    box-shadow:
        0 16px 35px rgba(75,51,40,.16);
}

.botao:active{
    transform:scale(.97);
}


/* ==============================
   ÍCONE
============================== */

.icone{
    width:78px;
    height:78px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#f6f0e9;

    border:1px solid #dccbb7;

    font-size:38px;

    margin-bottom:20px;

    transition:.25s;
}

.botao:hover .icone{
    background:#7b1e2b;

    border-color:#7b1e2b;

    transform:scale(1.08);
}


/* ==============================
   TÍTULO
============================== */

.titulo{
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:23px;

    font-weight:700;

    color:#5d1621;

    letter-spacing:1px;

    margin-bottom:10px;
}


/* ==============================
   DESCRIÇÃO
============================== */

.desc{
    max-width:280px;

    font-size:14px;

    color:#6f5848;

    line-height:1.5;
}


/* ==============================
   DESTAQUE DOS CARTÕES
============================== */

.clicks:hover .titulo{
    color:#7b1e2b;
}

.digitavel:hover .titulo{
    color:#7b1e2b;
}


/* ==============================
   RODAPÉ
============================== */

.rodape{
    margin-top:32px;

    font-size:11px;

    letter-spacing:2px;

    color:#8b7665;

    text-transform:uppercase;
}


/* ==============================
   CELULAR
============================== */

@media(max-width:700px){

    body{
        padding:20px;
    }

    .cabecalho{
        margin-bottom:30px;
    }

    .iconePrincipal{
        width:70px;
        height:70px;

        font-size:35px;
    }

    h1{
        font-size:32px;

        letter-spacing:3px;
    }

    .sub{
        font-size:14px;
    }

    .botoes{
        grid-template-columns:1fr;

        gap:15px;
    }

    .botao{
        min-height:210px;

        padding:25px 20px;
    }

}


/* ==============================
   TELAS MUITO PEQUENAS
============================== */

@media(max-width:400px){

    h1{
        font-size:28px;
    }

    .iconePrincipal{
        width:62px;
        height:62px;

        font-size:30px;
    }

    .botao{
        min-height:195px;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="cabecalho">

        <div class="iconePrincipal">
            ☕
        </div>

        <h1>CONTAGEM DO CAFÉ</h1>

        <div class="sub">
            Escolha como deseja realizar a contagem
        </div>

        <div class="decoracao">
            <span></span>
            <i></i>
            <span></span>
        </div>

    </div>


    <div class="botoes">

        <!-- CONTAGEM RÁPIDA -->

        <a href="cafe2.html" class="botao clicks">

            <div class="icone">
                👆
            </div>

            <div class="titulo">
                CONTAGEM RÁPIDA
            </div>

            <div class="desc">
                Registre os produtos rapidamente
                através de cliques.
            </div>

        </a>


        <!-- CONTAGEM MANUAL -->

        <a href="cafe3.html" class="botao digitavel">

            <div class="icone">
                ⌨️
            </div>

            <div class="titulo">
                CONTAGEM MANUAL
            </div>

            <div class="desc">
                Informe manualmente a quantidade
                de cada produto.
            </div>

        </a>

    </div>


    <div class="rodape">
        ☕ Sistema de Gestão do Café
    </div>

</div>

</body>
</html>
