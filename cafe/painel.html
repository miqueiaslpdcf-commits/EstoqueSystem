<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<title>📋 Painel Geral</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bordo:#7b1e2b;
  --bordo-dark:#5d1621;
  --dourado:#c79a45;
  --dourado-claro:#dfc27a;
  --marrom-pastel:#eadfd2;
  --marrom-claro:#f6f0e9;
  --marrom:#8b6f5a;
  --texto:#4b3328;
  --branco:#fffdf9;
}

body{
  margin:0;
  padding:20px;
  font-family:system-ui,Arial;
  background:var(--marrom-claro);
  color:var(--texto);
}

/* TÍTULO */

h1{
  text-align:center;
  margin-bottom:25px;
  font-size:clamp(28px,5vw,45px);
  color:var(--bordo);
  font-weight:800;
}

/* MENSAGEM */

#mensagemMotivacional{
  background:var(--branco);
  border:2px solid var(--dourado);
  color:var(--texto);
  padding:18px;
  border-radius:18px;
  margin:0 auto 25px;
  text-align:center;
  font-size:18px;
  font-weight:600;
  max-width:900px;
  box-shadow:0 8px 20px rgba(93,22,33,0.12);
  animation:aparecer 0.4s ease;
}

@keyframes aparecer{
  from{
    opacity:0;
    transform:translateY(-10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:18px;
}

/* CARD */

.card{
  background:var(--branco);
  border-radius:22px;
  padding:25px 15px;
  text-decoration:none;
  color:var(--texto);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:180px;
  transition:0.2s;
  box-shadow:0 8px 20px rgba(93,22,33,0.12);
}

.card:active{
  transform:scale(0.96);
}

.card:hover{
  background:var(--marrom-pastel);
  transform:translateY(-3px);
}

/* ÍCONE */

.icone{
  font-size:55px;
  margin-bottom:15px;
}

/* TÍTULO */

.titulo{
  font-size:22px;
  font-weight:bold;
  text-align:center;
  color:var(--bordo);
}

/* SUB */

.sub{
  margin-top:8px;
  font-size:13px;
  color:var(--marrom);
  text-align:center;
}

/* CORES DOS CARDS */

/* BOMBONIERE */
.bomboniere{
  border:3px solid var(--dourado-claro);
}

/* BEBIDAS */
.bebidas{
  border:3px solid var(--dourado-claro);
}

/* CAFÉ */
.cafe{
  border:3px solid var(--dourado-claro);
}

/* COZINHA */
.cozinha{
  border:3px solid var(--dourado-claro);
}

/* ESTOQUE */
.estoque{
  border:3px solid var(--dourado-claro);
}

/* ESTOQUE SECO */
.estoque-seco{
  border:3px solid var(--dourado-claro);
}

/* DESKTOP */

@media(min-width:768px){

  body{
    padding:35px;
  }

  .grid{
    grid-template-columns:repeat(3,1fr);
  }

}
</style>
</head>

<body>
